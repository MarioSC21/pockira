<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pockira.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pockira: tus notas, a mano." />
    <title>Pockira</title>
    <script>
      // Applied before React mounts so the stored theme paints immediately
      // instead of flashing the light one for a frame. Mirrors THEMES in
      // src/shared/lib/theme.ts: [isDark, background] per theme id.
      try {
        var themes = {
          light: [false, "oklch(1 0 0)"],
          dark: [true, "oklch(0.145 0 0)"],
          "catppuccin-latte": [false, "#eff1f5"],
          "catppuccin-frappe": [true, "#303446"],
          "catppuccin-macchiato": [true, "#24273a"],
          "catppuccin-mocha": [true, "#1e1e2e"],
          twilight: [true, "oklch(0.24 0.07 270)"],
          midnight: [true, "oklch(0.18 0.05 262)"],
        }
        var storedTheme = localStorage.getItem("pockira:theme")
        var themeId = themes[storedTheme]
          ? storedTheme
          : window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light"
        var root = document.documentElement
        root.dataset.theme = themeId
        if (themes[themeId][0]) {
          root.classList.add("dark")
        }
        root.style.setProperty("--boot-background", themes[themeId][1])
      } catch (e) {}
    </script>
  </head>

  <body>
    <!-- Shown while the JavaScript loads; React replaces it on first render.
         Inline styles because the app stylesheet is not loaded yet. -->
    <div id="root">
      <div class="boot-splash" aria-hidden="true">
        <img alt="" src="/pockira.svg" />
      </div>
    </div>
    <style>
      html {
        background: var(--boot-background, transparent);
      }
      .boot-splash {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .boot-splash img {
        width: 56px;
        height: 56px;
        animation: boot-pulse 1.2s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        50% {
          opacity: 0.5;
          transform: scale(0.94);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash img {
          animation: none;
        }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
