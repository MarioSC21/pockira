# Builds the web app and publishes it to Cloudflare Pages
# (project "pockira-app", https://pockira-app.pages.dev) when a release tag is
# pushed, so the web ships the same fixes as the desktop/Android release
# (release.yml). Pushes to main alone do not deploy.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   VITE_INSFORGE_URL, VITE_INSFORGE_ANON_KEY — baked into the frontend build.
#   CLOUDFLARE_API_TOKEN — token with the "Cloudflare Pages: Edit" permission.
#   CLOUDFLARE_ACCOUNT_ID — the Cloudflare account that owns the project.
name: Deploy web app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          VITE_INSFORGE_URL: ${{ secrets.VITE_INSFORGE_URL }}
          VITE_INSFORGE_ANON_KEY: ${{ secrets.VITE_INSFORGE_ANON_KEY }}

      # cloudflare/wrangler-action installs wrangler with `pnpm add`, which
      # pnpm 11 rejects over its ignored build scripts, so run it directly.
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name pockira-app --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
